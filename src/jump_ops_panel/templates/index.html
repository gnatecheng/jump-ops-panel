{% extends "base.html" %}
{% block title %}Jump Ops Panel{% endblock %}
{% block body %}
<header class="app-header">
  <h1>Jump Ops Panel</h1>
  <form method="get" action="/">
    <label for="profile" style="display:inline">环境</label>
    <select name="profile" id="profile" onchange="this.form.submit()">
      {% for p in profiles %}
      <option value="{{ p.id }}" {% if p.id == active_id %}selected{% endif %}>{{ p.label }}</option>
      {% endfor %}
    </select>
  </form>
  <span class="meta header-target">目标：{{ profile.target.asset_ref }} / {{ profile.target.account_ref or 'default' }}</span>
</header>

<div class="grid">
  <section>
    {% include "partials/exec_workspace.html" %}
  </section>

  <section id="schedule-panels"
    hx-get="/profiles/{{ profile.id }}/schedules"
    hx-trigger="load, every 5s"
    hx-swap="innerHTML">
    <p class="meta">定时 Panel 加载中…</p>
  </section>
</div>
{% endblock %}
