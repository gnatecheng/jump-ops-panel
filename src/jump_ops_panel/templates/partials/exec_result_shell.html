{# Stable Exec UI: upper region swaps; textarea never replaced (keeps user resize). #}
<div id="exec-result" style="margin-top:0.75rem" class="exec-result-root">
  <div id="exec-result-upper">
    <div class="output-panel">
      <div class="output-head">
        <span class="output-label">Exec 输出</span>
        <span class="output-head-meta"></span>
      </div>
    </div>
  </div>
  <textarea id="exec-output-area" class="output-area" readonly rows="10" aria-label="命令输出"
    data-jop-output-id="exec">（尚未执行。选择脚本或 bash 后点 Exec。）</textarea>
</div>
